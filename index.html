    <style>
        :root {
            --bg-fallback: #0fafff;
            --overlay-color: rgba(0, 0, 0, 0.4);
            --text-main: #ffffff;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-main);

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        #backgroundCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            display: block;
            background-color: var(--bg-fallback);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-color);
            z-index: -1;
        }

        main {
            position: relative;
            z-index: 1;
            padding: 1.5rem;
            max-width: 800px;
            animation: fadeIn 0.8s ease-out;
            will-change: transform, opacity;
        }

        h1 {
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            letter-spacing: -0.03em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p {
            font-size: 1.1rem;
            margin: 0;
            opacity: 0.95;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-weight: 400;
        }

        a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            transition: border-bottom-color 0.2s ease, opacity 0.2s ease;
            padding-bottom: 2px;
        }

        a:hover {
            border-bottom-color: var(--text-main);
            opacity: 1;
        }

        .separator {
            margin: 0 0.5rem;
            opacity: 0.6;
        }

        .copyright {
            margin-top: 2rem;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="backgroundCanvas"></canvas>
    <div class="overlay"></div>

    <main>
        <h1>Andrea Sacco</h1>
        <p>
            dev: <a href="https://www.github.com/asnadc" title="GitHub Profile">asnadc</a>
            <span class="separator">|</span> 
            alias: <a href="https://linkedin.com/in/andreasaccodev" title="LinkedIn Profile">andreasaccodev</a>
        </p>

        <div class="copyright">
            &copy; <span id="year"></span> Andrea Sacco (asnadc)
        </div>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const canvasElement = document.getElementById('backgroundCanvas');
        const glContext = canvasElement.getContext('webgl', { antialias: false, depth: false });

        if (glContext) {
            const isBot = /bot|googlebot|lighthouse|crawler|spider|robot|crawling/i.test(navigator.userAgent);
            const mainProgram = glContext.createProgram();
            let animationFrameHandle;

            const fragmentSource = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uResolution;

            float getDistance(vec3 currentPoint) {
                vec3 originPoint = currentPoint;
                float currentScale = 1.0;
                for (int iteration = 0; iteration < 5; iteration++) {
                    currentPoint = 1.0 - abs(currentPoint - 1.0);
                    float iterationDistortion = 2.0 / clamp(dot(currentPoint, currentPoint), 0.3, 1.0);
                    currentPoint *= iterationDistortion; 
                    currentScale *= iterationDistortion;
                    currentPoint += originPoint;
                }
                return length(currentPoint) / currentScale - 0.001;
            }

            void main() {
                vec2 screenCoords = (gl_FragCoord.xy - .5 * uResolution) / uResolution.y;
                vec3 rayOrigin = vec3(0.5 * sin(uTime * .1), 0.5 * cos(uTime * .1), uTime);
                vec3 rayDirection = normalize(vec3(screenCoords, 1.2));
                vec3 rayPosition = rayOrigin;

                float surfaceDistance, totalTravelDist = 0.0;
                for (int stepCount = 0; stepCount < 70; stepCount++) {
                    surfaceDistance = getDistance(rayPosition);
                    rayPosition += rayDirection * surfaceDistance;
                    totalTravelDist += surfaceDistance;
                    if (surfaceDistance < .001 || totalTravelDist > 15.) break;
                }

                float fogEffect = 1.0 / (1.0 + totalTravelDist * totalTravelDist * 0.1);
                vec3 azureColor = vec3(0.0, 0.6, 1.0);
                vec3 deepBlue = vec3(0.0, 0.05, 0.2);

                vec3 finalColor = mix(deepBlue, azureColor, fogEffect);
                finalColor += azureColor * pow(fogEffect, 3.0);

                gl_FragColor = vec4(finalColor, 1.0);
            }`;

            const addShaderModule = (shaderType, shaderSource) => {
                const shaderObject = glContext.createShader(shaderType);
                glContext.shaderSource(shaderObject, shaderSource);
                glContext.compileShader(shaderObject);
                glContext.attachShader(mainProgram, shaderObject);
            };

            addShaderModule(glContext.VERTEX_SHADER, `attribute vec4 aVertexPos; void main(){gl_Position=aVertexPos;}`);
            addShaderModule(glContext.FRAGMENT_SHADER, fragmentSource);
            glContext.linkProgram(mainProgram);
            glContext.useProgram(mainProgram);

            glContext.bindBuffer(glContext.ARRAY_BUFFER, glContext.createBuffer());
            glContext.bufferData(glContext.ARRAY_BUFFER, new Float32Array([-1,1,-1,-1,1,1,1,-1]), glContext.STATIC_DRAW);
            
            const positionLocation = glContext.getAttribLocation(mainProgram, 'aVertexPos');
            glContext.enableVertexAttribArray(positionLocation);
            glContext.vertexAttribPointer(positionLocation, 2, glContext.FLOAT, false, 0, 0);

            const uTimeLocation = glContext.getUniformLocation(mainProgram, 'uTime');
            const uResolutionLocation = glContext.getUniformLocation(mainProgram, 'uResolution');

            const renderFrame = (currentTime) => {
                if (document.hidden) return;

                if (canvasElement.width !== window.innerWidth || canvasElement.height !== window.innerHeight) {
                    canvasElement.width = window.innerWidth;
                    canvasElement.height = window.innerHeight;
                    glContext.viewport(0, 0, canvasElement.width, canvasElement.height);
                }
                
                glContext.uniform1f(uTimeLocation, currentTime * 0.0006);
                glContext.uniform2f(uResolutionLocation, canvasElement.width, canvasElement.height);

                glContext.drawArrays(glContext.TRIANGLE_STRIP, 0, 4);
                animationFrameHandle = requestAnimationFrame(renderFrame);
            };

            if (!isBot) {
                renderFrame(0);
            } else {
                glContext.clearColor(0.0, 0.05, 0.2, 1.0);
                glContext.clear(glContext.COLOR_BUFFER_BIT);
            }

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) cancelAnimationFrame(animationFrameHandle);
                else if (!isBot) animationFrameHandle = requestAnimationFrame(renderFrame);
            });
        }
    </script>
</body>
</html>
